name: 予測ロジック数値パリティ検証

# 予測ロジック(JS版 predict-core.js / predict_template.html / .treg 書き出し)に
# 触れる変更が入ったら、C++参照実装(native_predictor/predict_native_v2.cpp)との
# 数値一致を必ず自動検証する。2系統(ネイティブC++ / JS)の実装がズレたまま気づかず
# マージ・配布されることを防ぐためのゲート(type4/5のみ、run_matrix_test.js内で
# 別途Python独立実装との突合せも行う。詳細はweb/js_predict_poc/README.md参照)。
#
# ローカルでの手動実行: cd web/js_predict_poc && npm install && npm test

on:
  push:
    paths:
      - "web/js_predict_poc/**"
      - "web/predict_template.html"
      - "native_predictor/**"
      - "web/py/train_bridge.py"
      - "web/py/predict_template.py"
      - "web/py/_light.py"
      - "train_bridge.py"
      - "predict_template.py"
      - "_light.py"
      - ".github/workflows/predict-parity.yml"
  pull_request:
    paths:
      - "web/js_predict_poc/**"
      - "web/predict_template.html"
      - "native_predictor/**"
      - "web/py/train_bridge.py"
      - "web/py/predict_template.py"
      - "web/py/_light.py"
      - "train_bridge.py"
      - "predict_template.py"
      - "_light.py"
      - ".github/workflows/predict-parity.yml"
  workflow_dispatch: {}

jobs:
  matrix-parity:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: テスト依存関係インストール(jsdom)
        working-directory: web/js_predict_poc
        run: npm install

      # 高-8: 以前は C++参照実装を一切コンパイルせず、コミット済みの凍結された
      # matrix_cpp_out/*_pred.csv とだけ比較していたため、predict_native_v2.cpp を
      # 壊す変更が入ってもCIが検出できなかった(「3系統一致ゲート」が実質不成立)。
      # ここで実際に g++ ビルド→現行の matrix/*.treg で予測を再実行→
      # matrix_cpp_out/*_pred.csv を上書き、してから JS 側との突合せに進む。
      - name: C++参照実装をビルド(predict_native_v2.cpp)
        working-directory: native_predictor
        run: g++ -O2 -std=c++17 predict_native_v2.cpp -o predict_native_ref

      - name: C++参照実装でmatrix_cpp_outを再生成(302行 x 46設定)
        working-directory: web/js_predict_poc
        run: |
          set -e
          BIN=../../native_predictor/predict_native_ref
          mkdir -p matrix_cpp_out
          node -e "JSON.parse(require('fs').readFileSync('matrix/_manifest.json','utf-8')).forEach(n=>console.log(n))" > /tmp/manifest.txt
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            treg="matrix/${name}.treg"
            if [ ! -f "$treg" ]; then
              echo "SKIP(.tregなし): $name"
              continue
            fi
            tmp_csv="/tmp/${name}.csv"
            cp stress_test.csv "$tmp_csv"
            "$BIN" "$tmp_csv" "$treg"
            mv "/tmp/${name}_pred.csv" "matrix_cpp_out/${name}_pred.csv"
          done < /tmp/manifest.txt
          echo "再生成後の差分(意図しないドリフトがあれば確認すること):"
          git diff --stat -- matrix_cpp_out/ || true
      # 高-3(2026-07-16): 以前はここに「predict_native_v2.cppは.treg type 4(linear_poly)/
      # type 5(blend)をまだ読めないため、matrix/_manifest.json の40フィクスチャは
      # type 0〜3のみ」という注記があったが、Phase2でC++にtype4/5の読込(整合性検査・
      # blend再帰深さ制限込み)を実装済みのため既に矛盾する古い記述だった。現在は
      # matrix/_manifest.json に type4(linear_poly)3設定・type5(blend)3設定
      # (既存のblend_lgbm_linear_log1p_roundFalseを含めれば計46設定)を統合済みで、
      # 上のループでC++参照実装による再生成・突合せが行われる。
      # matrix/_manifest_pyref.json (Python独立実装 matrix_python_out/ との突合せ経路)は
      # 現状空で、将来C++がまだ対応しない新しい.treg型が追加された場合のための予備。

      - name: predict-core.js 単体パリティテスト(7行 x 4種別)
        working-directory: web/js_predict_poc
        run: node run_parity.js

      - name: predict-core.js 網羅的マトリクステスト(302行 x 46設定)
        working-directory: web/js_predict_poc
        run: node run_matrix_test.js

      - name: predict_template.html(本番配布物)の網羅的マトリクステスト
        working-directory: web/js_predict_poc
        run: node run_html_matrix_test.js

      # E14: CSVエンコーディング境界ケース(大きなスケールの値/cp932/BOM/半角カナ混在ヘッダ)
      # のパリティ検証。フィクスチャは encoding_matrix/ にコミット済み(gen_encoding_fixtures.py
      # で再生成可能)。cp932フィクスチャはnative実装が非対応のためJS側のみ検証する。
      - name: エンコーディング境界ケースのパリティテスト(E14)
        working-directory: web/js_predict_poc
        run: node run_encoding_matrix_test.js ../../native_predictor/predict_native_ref
