name: 予測ロジック数値パリティ検証

# 予測ロジック(JS版 predict-core.js / predict_template.html / .treg 書き出し)に
# 触れる変更が入ったら、C++参照実装(native_predictor/predict_native_v2.cpp)との
# 数値一致を必ず自動検証する。2系統(ネイティブC++ / JS)の実装がズレたまま気づかず
# マージ・配布されることを防ぐためのゲート(type4/5のみ、run_matrix_test.js内で
# 別途Python独立実装との突合せも行う。詳細はweb/js_predict_poc/README.md参照)。
#
# ローカルでの手動実行: cd web/js_predict_poc && npm install && npm test

on:
  push:
    paths:
      - "web/js_predict_poc/**"
      - "web/predict_template.html"
      - "native_predictor/**"
      - "web/py/train_bridge.py"
      - "web/py/predict_template.py"
      - "web/py/_light.py"
      - "train_bridge.py"
      - "predict_template.py"
      - "_light.py"
      - "web/sample_data.csv"
      - ".github/workflows/predict-parity.yml"
  pull_request:
    paths:
      - "web/js_predict_poc/**"
      - "web/predict_template.html"
      - "native_predictor/**"
      - "web/py/train_bridge.py"
      - "web/py/predict_template.py"
      - "web/py/_light.py"
      - "train_bridge.py"
      - "predict_template.py"
      - "_light.py"
      - "web/sample_data.csv"
      - ".github/workflows/predict-parity.yml"
  workflow_dispatch: {}

jobs:
  matrix-parity:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Node.js セットアップ
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # root↔web/py 同期ゲート: train_bridge.py/_light.py/predict_template.py は
      # プロジェクトルートと web/py/ に同一内容で複製配置されている(exe版とWeb版で
      # Pythonランタイムの配置場所が異なるため、CLAUDE.mdルール2)。ルート側だけ変更して
      # web/py/へのコピーを忘れると、exe版とWeb版で予測ロジックが黙って乖離する。
      - name: root↔web/py 同期チェック
        run: |
          set -e
          fail=0
          diff -q train_bridge.py web/py/train_bridge.py || fail=1
          diff -q _light.py web/py/_light.py || fail=1
          diff -q predict_template.py web/py/predict_template.py || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "::error::train_bridge.py / _light.py / predict_template.py がルートと web/py/ で一致していません。"
            echo "::error::ルール: ルート側を編集してweb/py/へコピーすること(CLAUDE.mdルール2参照)。"
            exit 1
          fi
          echo "OK: ルートとweb/py/の3ファイルは一致しています。"

      - name: テスト依存関係インストール(jsdom)
        working-directory: web/js_predict_poc
        run: npm install

      # 高-8: 以前は C++参照実装を一切コンパイルせず、コミット済みの凍結された
      # matrix_cpp_out/*_pred.csv とだけ比較していたため、predict_native_v2.cpp を
      # 壊す変更が入ってもCIが検出できなかった(「3系統一致ゲート」が実質不成立)。
      # ここで実際に g++ ビルド→現行の matrix/*.treg で予測を再実行→
      # matrix_cpp_out/*_pred.csv を上書き、してから JS 側との突合せに進む。
      - name: C++参照実装をビルド(predict_native_v2.cpp)
        working-directory: native_predictor
        run: g++ -O2 -std=c++17 predict_native_v2.cpp -o predict_native_ref

      - name: C++参照実装でmatrix_cpp_outを再生成(302行 x 46設定)
        working-directory: web/js_predict_poc
        run: |
          set -e
          BIN=../../native_predictor/predict_native_ref
          mkdir -p matrix_cpp_out
          node -e "JSON.parse(require('fs').readFileSync('matrix/_manifest.json','utf-8')).forEach(n=>console.log(n))" > /tmp/manifest.txt
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            treg="matrix/${name}.treg"
            if [ ! -f "$treg" ]; then
              echo "SKIP(.tregなし): $name"
              continue
            fi
            tmp_csv="/tmp/${name}.csv"
            cp stress_test.csv "$tmp_csv"
            "$BIN" "$tmp_csv" "$treg"
            mv "/tmp/${name}_pred.csv" "matrix_cpp_out/${name}_pred.csv"
          done < /tmp/manifest.txt
          echo "再生成後の差分(意図しないドリフトがあれば確認すること):"
          git diff --stat -- matrix_cpp_out/ || true
      # 高-3(2026-07-16): 以前はここに「predict_native_v2.cppは.treg type 4(linear_poly)/
      # type 5(blend)をまだ読めないため、matrix/_manifest.json の40フィクスチャは
      # type 0〜3のみ」という注記があったが、Phase2でC++にtype4/5の読込(整合性検査・
      # blend再帰深さ制限込み)を実装済みのため既に矛盾する古い記述だった。現在は
      # matrix/_manifest.json に type4(linear_poly)3設定・type5(blend)3設定
      # (既存のblend_lgbm_linear_log1p_roundFalseを含めれば計46設定)を統合済みで、
      # 上のループでC++参照実装による再生成・突合せが行われる。
      # matrix/_manifest_pyref.json (Python独立実装 matrix_python_out/ との突合せ経路)は
      # 現状空で、将来C++がまだ対応しない新しい.treg型が追加された場合のための予備。

      - name: predict-core.js 単体パリティテスト(7行 x 4種別)
        working-directory: web/js_predict_poc
        run: node run_parity.js

      - name: predict-core.js 網羅的マトリクステスト(302行 x 46設定)
        working-directory: web/js_predict_poc
        run: node run_matrix_test.js

      - name: predict_template.html(本番配布物)の網羅的マトリクステスト
        working-directory: web/js_predict_poc
        run: node run_html_matrix_test.js

      # E14: CSVエンコーディング境界ケース(大きなスケールの値/cp932/BOM/半角カナ混在ヘッダ)
      # のパリティ検証。フィクスチャは encoding_matrix/ にコミット済み(gen_encoding_fixtures.py
      # で再生成可能)。cp932フィクスチャはnative実装が非対応のためJS側のみ検証する。
      - name: エンコーディング境界ケースのパリティテスト(E14)
        working-directory: web/js_predict_poc
        run: node run_encoding_matrix_test.js ../../native_predictor/predict_native_ref

  # 中-M4: これまでのCIは「.tregを読む3実装(native/JS/Python独立実装)同士」の閉じた
  # 比較のみで、「画面のR²(アプリ内Python予測、predict_template.py)と配布物(.treg)の
  # 予測が同じ」という一気通貫の保証がなかった。ここで実際に web/sample_data.csv を
  # train_bridge.py で学習し、同じ予測用CSVに対する (a) predict_template.py の出力と
  # (b) native(g++ビルド)/JS の出力を相対誤差で突き合わせる。
  e2e-app-treg-parity:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Node.js セットアップ
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Python依存関係インストール(train_bridge.py実行に必要な最小構成)
        run: pip install numpy pandas lightgbm scipy threadpoolctl

      - name: C++参照実装をビルド(predict_native_v2.cpp)
        working-directory: native_predictor
        run: g++ -O2 -std=c++17 predict_native_v2.cpp -o predict_native_ref

      - name: 学習(web/sample_data.csv, quickモード) → trained_model/model.treg
        run: |
          set -e
          rm -rf trained_model trained_model_tmp
          python train_bridge.py web/sample_data.csv rent_10kyen 0 quick 1
          test -f trained_model/model.treg
          test -f trained_model/model_meta.json

      - name: 予測用CSVを準備(学習用CSVと同じ列構成の複製)
        run: |
          mkdir -p /tmp/e2e
          cp web/sample_data.csv /tmp/e2e/input.csv

      - name: (a) アプリ内Python予測(predict_template.py)
        run: python predict_template.py /tmp/e2e/input.csv

      - name: (b) native予測(predict_native_ref、入力csv→input_pred.csv)
        run: TREG_NO_GUI=1 ./native_predictor/predict_native_ref /tmp/e2e/input.csv trained_model/model.treg

      - name: (c) JS予測(predict-core.js経由、run_e2e_predict.js)
        run: node web/js_predict_poc/run_e2e_predict.js /tmp/e2e/input.csv trained_model/model.treg /tmp/e2e/input_js.csv

      - name: 3経路(Python/native/JS)の予測値を相対誤差で突合
        run: |
          python tests/e2e_compare_predictions.py rent_10kyen \
            /tmp/e2e/input_predicted.csv /tmp/e2e/input_pred.csv /tmp/e2e/input_js.csv \
            --tol-abs 1e-5 --tol-rel 1e-4

  # 体制レバー3(観点4): test_light_parity.py(_light.py が sklearn/scipy と数値一致することを
  # 検証する安全性ゲート)がこれまでCIに組み込まれておらず、ローカルで手動実行するしかなかった。
  # ubuntu-latest + pip の素のCPythonで動くため、最も安価に追加できるゲート。
  light-parity:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python依存関係インストール(numpy/scipy/scikit-learn)
        run: pip install numpy scipy scikit-learn

      - name: _light.py が sklearn/scipy と数値一致することを検証
        run: python tests/test_light_parity.py
